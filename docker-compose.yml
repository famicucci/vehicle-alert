services:
  mysql:
    image: mysql:8.0
    container_name: vehicle-alert-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: vehiclealertdb
    ports:
      - "3307:3306"
    volumes:
      - tms_mysql_data:/var/lib/mysql

volumes:
  tms_mysql_data:
